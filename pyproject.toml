[project]
name = "finearm"
version = "0.1.0"
description = "Robot-arm VLA fine-tuning framework: teleop data collection, real-time chunked inference, and RL post-training (pi0.5 / Panthera-HT)"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
# The daemon core and profiles are stdlib-only; robot arms that vendor a
# Python SDK declare what their adapter needs here (panthera: none beyond stdlib).
robot = ["pyyaml>=6"]
infer = ["numpy>=2,<2.3", "opencv-python>=4.8", "websockets>=13", "msgpack>=1.1"]
dev = ["pytest>=8", "ruff>=0.8"]

[project.scripts]
finearm-daemon = "finearm.arms.daemon.cli:main"
finearm-infer = "finearm.infer.cli:main"
finearm-collect = "finearm.data.cli:main"

# Phase 1: src-layout installable package (finearm.core only, stdlib deps).
# Domain extras (robot/data/infer/rl) land with their phases per the archived refactor plan (git history).
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/finearm"]

[tool.ruff]
# vendored upstream tree — its style is not our lint surface
extend-exclude = ["models/openpi"]

line-length = 110
target-version = "py311"

[tool.ruff.lint]
# Bootstrap gate: catch broken code only. The full rule set is tightened phase by
# phase as modules move into src/finearm (the archived refactor plan (git history) Phase 8).
select = ["E4", "E7", "E9", "F"]
ignore = [
    "E401", # multiple imports on one line (cosmetic; legacy tests)
    "E402", # import not at top: legacy sys.path-insert bootstrap pattern, reorganized in later phases
    "F401", # unused imports: cleaned up when modules migrate (some are deliberate probe/re-export imports)
    "F841", # unused locals: reviewed during module migration
]

[tool.pytest.ini_options]
# Machines that source ROS Humble leak launch_testing/ament pytest plugins into
# every run and break pytest 9; disable them globally (same list as
# RL/rlt_panthera/pytest.ini). Harmless on clean CI runners.
addopts = "-p no:launch_testing -p no:launch_testing_ros -p no:launch_ros -p no:ament_copyright -p no:ament_flake8 -p no:ament_lint -p no:ament_pep257 -p no:ament_xmllint"
# Run tests/core (and future suites rooted here) without installing the package.
pythonpath = ["src"]
