  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-soft:    #5a6580;
      --color-accent:  #bf4520;
      --color-rule:    rgba(45,49,66,0.12);

      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif SC', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1080px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.3vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.25rem;
    }
    .crumb {
      display: inline-flex; align-items: center; gap: 6px;
      margin: 0 0 12px;
      padding: 7px 12px;
      border: 1px solid var(--color-rule);
      border-radius: 6px;
      background: transparent;
      font: 500 13px/1 var(--font-sans);
      color: var(--color-muted);
      text-decoration: none;
    }
    .crumb:hover { border-color: var(--color-accent); color: var(--color-ink); }
    .crumb:focus-visible { outline: 3px solid var(--color-accent); outline-offset: 2px; }
    .caption {
      margin-top: 14px;
      font-family: var(--font-mono);
      font-size: 12px;
      line-height: 1.8;
      color: var(--color-muted);
      letter-spacing: 0.01em;
    }
    svg { width: 100%; min-width: 960px; display: block; }
    .flow {
      fill: none;
      stroke: var(--color-muted);
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-dasharray: 3 24;
      opacity: 0.85;
      pointer-events: none;
      animation: flow-dash 3s linear infinite;
    }
    .flow-accent { stroke: var(--color-accent); }
    @keyframes flow-dash { to { stroke-dashoffset: -27; } }
    @media (prefers-reduced-motion: reduce) { .flow { display: none !important; } }
    @media print {
      .flow { display: none !important; }
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
