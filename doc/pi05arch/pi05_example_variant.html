<html lang="zh-CN">
<head>

  <title>示例③ 变体 — 单相机短指令 · π0.5</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&family=Noto+Sans+SC:wght@400;500;600&family=Noto+Serif+SC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-soft:    #5a6580;
      --color-accent:  #bf4520;
      --color-rule:    rgba(45,49,66,0.12);
      --font-sans:     'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif SC', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1080px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.3vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.25rem;
    }
    .crumb {
      display: inline-flex; align-items: center; gap: 6px;
      margin: 0 0 12px;
      padding: 7px 12px;
      border: 1px solid var(--color-rule);
      border-radius: 6px;
      background: transparent;
      font: 500 13px/1 var(--font-sans);
      color: var(--color-muted);
      text-decoration: none;
    }
    .crumb:hover { border-color: var(--color-accent); color: var(--color-ink); }
    .crumb:focus-visible { outline: 3px solid var(--color-accent); outline-offset: 2px; }
    .siblings { margin: 0 0 12px; font: 500 13px/1.6 var(--font-sans); color: var(--color-soft); }
    .siblings a { color: var(--color-accent); text-decoration: none; border-bottom: 1px solid rgba(191,69,32,0.4); }
    .siblings a:hover { border-bottom-color: var(--color-accent); }
    .siblings .cur { color: var(--color-ink); font-weight: 600; border-bottom: 2px solid var(--color-accent); padding-bottom: 1px; }
    .caption {
      margin-top: 14px;
      font-family: var(--font-mono);
      font-size: 12px;
      line-height: 1.8;
      color: var(--color-muted);
      letter-spacing: 0.01em;
    }
    svg { width: 100%; min-width: 960px; display: block; }
    .flow {
      fill: none;
      stroke: var(--color-muted);
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-dasharray: 3 24;
      opacity: 0.85;
      pointer-events: none;
      animation: flow-dash 3s linear infinite;
    }
    .flow-accent { stroke: var(--color-accent); }
    @keyframes flow-dash { to { stroke-dashoffset: -27; } }
    @media (prefers-reduced-motion: reduce) { .flow { display: none !important; } }
    @media print {
      .flow { display: none !important; }
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>

    <h1>示例③ 变体 — 单相机短指令</h1>

        <line x1="480" y1="324" x2="480" y2="352" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#ex-arrow)"/>
        <line class="flow" x1="480" y1="324" x2="480" y2="352" aria-hidden="true"/>
        <line x1="480" y1="412" x2="480" y2="440" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#ex-arrow)"/>
        <line class="flow" x1="480" y1="412" x2="480" y2="440" aria-hidden="true"/>
        <line x1="480" y1="500" x2="480" y2="528" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#ex-arrow)"/>
        <line class="flow" x1="480" y1="500" x2="480" y2="528" aria-hidden="true"/>

        <rect x="340" y="40" width="280" height="104" rx="6" fill="#f5f5f5"/>

        <rect x="348" y="46" width="34" height="12" rx="2" fill="transparent" stroke="rgba(90,101,128,0.40)" stroke-width="0.8"/>
        <text x="365.0" y="55" fill="rgba(90,101,128,0.8)" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">INPUT</text>
        <text x="480.0" y="72" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">变体输入</text>
        <text x="480.0" y="94" fill="#5a6580" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">PROMPT: "GRAB"</text>
        <text x="480.0" y="111" fill="#5a6580" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">IMG: 1x3x224x224 (WRIST)</text>
        <text x="480.0" y="128" fill="#5a6580" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">STATE: 8D IN [-1,1]</text>
        <rect x="340" y="180" width="280" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="340" y="180" width="280" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="348" y="186" width="40" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>

        <text x="480.0" y="212.0" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">SigLIP 编码</text>
        <text x="480.0" y="229.0" fill="#4f5d75" font-size="10" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">OUT 1x256x2048</text>
        <rect x="340" y="268" width="280" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="340" y="268" width="280" height="56" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <rect x="348" y="274" width="40" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.40)" stroke-width="0.8"/>
        <text x="368.0" y="283" fill="rgba(79,93,117,0.8)" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">PREFIX</text>
        <text x="480.0" y="300.0" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">前缀 tokens</text>

        <rect x="340" y="356" width="280" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="340" y="356" width="280" height="56" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <rect x="348" y="362" width="36" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.40)" stroke-width="0.8"/>

        <text x="480.0" y="388.0" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">KV Cache</text>
        <text x="480.0" y="405.0" fill="#4f5d75" font-size="10" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">18L x [264,1,256] x2</text>
        <rect x="340" y="444" width="280" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="340" y="444" width="280" height="56" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
        <rect x="348" y="450" width="48" height="12" rx="2" fill="transparent" stroke="rgba(191,69,32,0.40)" stroke-width="0.8"/>

        <text x="480.0" y="476.0" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">10 步去噪</text>
        <text x="480.0" y="493.0" fill="#4f5d75" font-size="10" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">同示例① · 前缀更短更快</text>
        <rect x="340" y="532" width="280" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="340" y="532" width="280" height="56" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <rect x="348" y="538" width="26" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.40)" stroke-width="0.8"/>
        <text x="361.0" y="547" fill="rgba(79,93,117,0.8)" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">OUT</text>
        <text x="480.0" y="564.0" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">动作块 x_0</text>
        <text x="480.0" y="581.0" fill="#4f5d75" font-size="10" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">[1,50,32]</text>

        <rect x="680" y="396" width="240" height="112" rx="6" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
        <text x="800" y="428" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">对比示例①</text>
        <text x="800" y="456" fill="#5a6580" font-size="13" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">前缀 532 → 264</text>
        <text x="800" y="478" fill="#5a6580" font-size="13" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">KV 与首帧前向 ≈ 减半</text>
        <text x="800" y="498" fill="#5a6580" font-size="13" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">动作块输出不变</text>
      </svg>
    </div>
    <p class="caption">相机数（1~N）与指令长度直接决定前缀长度 → KV 缓存大小与首帧延迟；本例 264 vs 示例① 532<br>图像 token 顺序 = Observation.images 字典顺序；image_masks 全 0 的相机不产生有效 token（注意力掩掉）<br>去噪循环、动作块形状 [1,50,32] 与执行策略不随输入变体改变 — 这是 π0.5 系列的可配置伸缩点</p>
