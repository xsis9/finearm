  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-soft:    #5a6580;
      --color-accent:  #bf4520;
      --color-rule:    rgba(45,49,66,0.12);
      --font-sans:     'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif SC', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1320px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.6rem, 2.5vw + 0.8rem, 2.15rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    .hint {
      margin-top: 12px;
      font: 500 13px/1.5 var(--font-sans);
      color: var(--color-soft);
    }

    .examples { margin: 14px 0 0; font: 500 13px/1.8 var(--font-sans); color: var(--color-soft); }
    .examples a { color: var(--color-accent); text-decoration: none; border-bottom: 1px solid rgba(191,69,32,0.4); }
    .examples a:hover { border-bottom-color: var(--color-accent); }
    svg { width: 100%; min-width: 1280px; display: block; }

    /* ---- drill-down nodes ---- */
    .drill { cursor: pointer; }
    .drill .drill-box { transition: stroke 0.15s ease, stroke-width 0.15s ease; }
    .drill:hover .drill-box,
    .drill:focus-visible .drill-box { stroke: var(--color-accent); stroke-width: 1.6; }
    .drill:hover .drill-badge,
    .drill:focus-visible .drill-badge { fill: rgba(191,69,32,0.18); }

    /* ---- flowing-arrow animation (loop mode, CSS-only decorative layer) ---- */
    .flow {
      fill: none;
      stroke: var(--color-muted);
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-dasharray: 3 24;
      opacity: 0.85;
      pointer-events: none;
      animation: flow-dash 3s linear infinite;
    }
    .flow-accent { stroke: var(--color-accent); }
    @keyframes flow-dash { to { stroke-dashoffset: -27; } }

    @media (prefers-reduced-motion: reduce) {
      .flow { display: none !important; }
      .drill .drill-box { transition: none; }
    }
    @media print {
      .flow { display: none !important; }
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
