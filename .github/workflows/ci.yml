name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff==0.17.5
      - run: ruff check .

  core-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Also verifies the src-layout package builds/installs (hatchling).
      - run: pip install -e . pytest
      - name: Core suite (finearm.core, stdlib only)
        run: python -m pytest tests/core/

  arms-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      - name: Arms suite (profiles, daemon mock round-trip, legacy shims)
        run: python -m pytest tests/arms/

  infer-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy pytest
      - name: Infer suite (executor math, RTC golden comparison, stop-and-go, shims)
        run: python -m pytest tests/infer/

  collect-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      - name: Collect suite (registry, dagger stub, --arm parameterization, shims)
        run: python -m pytest tests/data/

  rl-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install numpy pytest matplotlib
      - name: RL suite (rltoken, replay, train_stage2, shims, golden harness)
        run: python -m pytest tests/rl/

  data-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install lerobot==0.5.1 pytest
      - run: pip install -e . --no-deps
      - run: pip install -e plugins/panthera-lerobot-collect --no-deps
      - name: Data-collection suite (panthera-lerobot-collect)
        working-directory: plugins/panthera-lerobot-collect
        run: python -m pytest tests/
